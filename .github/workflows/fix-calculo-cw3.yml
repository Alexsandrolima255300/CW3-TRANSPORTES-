name: Corrigir cotação CW3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir parser, cálculo e entradas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')

          old="""const formatCnpj = (value: string) => { const d = onlyDigits(value).slice(0, 14); return d.length > 12 ? `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}` : d; };"""
          new="""const formatCnpj = (value: string) => { const d = onlyDigits(value).slice(0, 14); return d.length > 12 ? `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}` : d; };
          const parsePtNumber = (value: string) => {
            let s = String(value ?? '').trim().replace(/\\s/g, '').replace(/R\\$/gi, '').trim();
            if (!s) return 0;
            if (s.includes(',') && s.includes('.')) s = s.replace(/\\./g, '').replace(',', '.');
            else if (s.includes(',')) s = s.replace(',', '.');
            else if (/^\\d{1,3}(\\.\\d{3})+$/.test(s)) s = s.replace(/\\./g, '');
            const n = Number(s);
            return Number.isFinite(n) && n >= 0 ? n : 0;
          };"""
          if old not in s: raise SystemExit('formatCnpj anchor not found')
          s=s.replace(old,new,1)

          s=s.replace("const nfValue = Number(nf.replace(',', '.'));\n    const weightValue = Number(weight.replace(',', '.'));\n    const volumeValue = Math.max(1, Number(volumes) || 1);\n    const h = Number(height.replace(',', '.'));\n    const w = Number(width.replace(',', '.'));\n    const l = Number(length.replace(',', '.'));", "const nfValue = parsePtNumber(nf);\n    const weightValue = parsePtNumber(weight);\n    const volumeValue = Math.max(1, parsePtNumber(volumes) || 1);\n    const h = parsePtNumber(height);\n    const w = parsePtNumber(width);\n    const l = parsePtNumber(length);", 1)

          old_calc="""const nfeCharge = nfValue * (cityRate.percentualNfe / 100);
    const grisCharge = nfValue * (cityRate.gris / 100);
    const ruralDetected = isRuralAddress();
    const ruralKm = ruralDetected ? await getRuralDistanceKm() : 0;
    const ruralCharge = ruralDetected && ruralKm > 0 ? ruralKm * 2 * RURAL_RATE : 0;
    const calculatedFreight = nfeCharge + cityRate.tda + ruralCharge;
    const minimumFreight = weightValue * (cityRate.garantia / 1000);
    const freight = Math.max(calculatedFreight, minimumFreight);"""
          new_calc="""const nfeCharge = nfValue * (cityRate.percentualNfe / 100);
    const grisCharge = nfValue * (cityRate.gris / 100);
    const ruralDetected = isRuralAddress();
    const ruralKm = ruralDetected ? await getRuralDistanceKm() : 0;
    const ruralCharge = ruralDetected && ruralKm > 0 ? ruralKm * 2 * RURAL_RATE : 0;
    const minimumFreight = weightValue * (cityRate.garantia / 1000);
    // A composição comercial usa o maior entre o percentual da NF-e e o mínimo por kg;
    // adicionais explícitos (GRIS, TDA e zona rural) entram depois, evitando que sejam apenas exibidos.
    const baseFreight = Math.max(nfeCharge, minimumFreight);
    const freight = baseFreight + grisCharge + cityRate.tda + ruralCharge;"""
          if old_calc not in s: raise SystemExit('calculation anchor not found')
          s=s.replace(old_calc,new_calc,1)

          old_nf="<label>Valor da NF-e<input value={nf} onChange={e=>setNf(e.target.value)} placeholder=\"R$ 0,00\" inputMode=\"decimal\"/></label>"
          new_nf="<label>Valor da NF-e<input value={nf} onChange={e=>{const v=e.target.value.replace(/[^0-9.,R$\\s-]/g,'');setNf(v)}} onBlur={()=>{const n=parsePtNumber(nf);if(n>0)setNf(n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}))}} placeholder=\"R$ 0,00\" inputMode=\"decimal\"/></label>"
          if old_nf not in s: raise SystemExit('NF input anchor not found')
          s=s.replace(old_nf,new_nf,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: corrigir NF-e e composição do frete CW3'
          git push

      - name: Remover workflow temporário
        if: success()
        run: |
          git rm .github/workflows/fix-calculo-cw3.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remover workflow temporário de correção' || true
          git push || true
